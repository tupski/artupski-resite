[package]
name = "artupski-resite"
version = "0.1.0"
description = "Desktop-native reverse engineering, website cloning, and site blueprinting tool."
authors = ["Artupski"]
edition = "2021"
rust-version = "1.78"

# The library is exposed so the desktop binary and future integration targets
# can share the same command surface.
[lib]
name = "artupski_resite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Rust owns native desktop capabilities only (ARCHITECTURE.md section 4).
# No business logic, no Node.js packages, no network/scanner dependencies.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Official HTTP client used ONLY as the AI provider transport: requests are
# executed by the Rust process, so remote OpenAI-compatible endpoints that do
# not send CORS headers remain reachable from the webview (no browser preflight).
tauri-plugin-http = "2"

# OS credential store for the AI provider API key (SECURITY.md section 2.1).
# The platform-specific backends are target-gated by the crate, so the
# `sync-secret-service` feature only pulls DBus/Secret-Service dependencies on
# Linux (which needs an active Secret Service/DBus daemon - documented in the
# phase-15 plan, C1). Windows uses the Credential Manager; macOS the Keychain.
# `linux-native` (keyutils) is deliberately NOT used because it is
# session-scoped and would lose the key on reboot.
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
